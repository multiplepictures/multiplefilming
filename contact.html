<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact Us - Multiple Pictures</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header>
        <div class="header-container">
            <img src="images/mp_logo.jpg" alt="Production logo featuring the letters M and P on top of each other in blue and red, with the words Multiple Pictures written on the bottom" class="header-logo">
            <div class="header-text">
                <h1>MULTIPLE PICTURES</h1>
                <h2>Production Company</h2>
            </div>
        </div>
    </header>

    <nav id="nav_menu" aria-label="Main Site Navigation">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="services.html">Services</a></li>
        </ul>
    </nav>

    <main class="container my-5">
        <div class="form-container style-form-card p-4 mx-auto" style="max-width: 37.5rem;">
            <h2 class="mb-4 text-center" style="color: #1a365d; font-weight: bold;">Production Inquiry Form</h2>
            <form action="#" method="post">
                
                <div class="mb-3">
                    <label for="client_name" class="form-label font-weight-bold">Full Name:</label>
                    <input type="text" id="client_name" name="client_name" class="form-control" placeholder="Your name.." required>
                </div>

                <div class="mb-3">
                    <label for="client_email" class="form-label font-weight-bold">Email Address:</label>
                    <input type="email" id="client_email" name="client_email" class="form-control" placeholder="Your email.." required>
                </div>

                <div class="mb-3">
                    <label for="service_type" class="form-label font-weight-bold">Requested Service:</label>
                    <select id="service_type" name="service_type" class="form-select">
                        <option value="editing">Digital Video Editing</option>
                        <option value="recording">Digital Video Recording</option>
                        <option value="sound">Digital Sound Design</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="project_date" class="form-label font-weight-bold">Target Production Date:</label>
                    <input type="date" id="project_date" name="project_date" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="project_details" class="form-label font-weight-bold">Project Brief / Details:</label>
                    <textarea id="project_details" name="project_details" class="form-control" rows="4" placeholder="Describe your production needs.."></textarea>
                </div>

                <div class="form-buttons d-flex gap-3 mt-4">
                    <input type="submit" class="btn btn-primary px-4 py-2 w-50" style="background-color: #2b6cb0; border: none; font-weight: bold;" value="Submit Request">
                    <input type="reset" class="btn btn-secondary px-4 py-2 w-50" style="background-color: #718096; border: none; font-weight: bold;" value="Reset Form">
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>Contact Email &ndash; <a href="mailto:multiplefilming@gmail.com">multiplefilming@gmail.com</a></p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
